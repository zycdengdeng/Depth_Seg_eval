# MP4视频评测配置文件
# 针对 /mnt/zihanw/inference_SLAM_output 数据集

# 数据路径
data:
  root: "/mnt/zihanw/inference_SLAM_output"
  # MP4数据结构: {root}/{segment}/{camera}_generated.mp4 和 {camera}_gt.mp4
  cameras:
    - "cross_left_120fov"
    - "cross_right_120fov"
    - "front_tele_30fov"
    - "front_wide_120fov"
    - "rear_left_70fov"
    - "rear_right_70fov"
    - "rear_tele_30fov"
  gen_suffix: "_generated"  # 生成视频后缀
  gt_suffix: "_gt"          # 真值视频后缀
  # 排除的文件夹（非数据文件夹）
  exclude_folders:
    - "guidance"
    - "visualize_controls.py"

# 输出路径
output:
  root: "/mnt/zyc_wzh/inference_SLAM_output/Depth_Seg_eval_Result"
  depth_maps: "/mnt/zyc_wzh/inference_SLAM_output/Depth_Seg_eval_Result/depth_maps"
  seg_maps: "/mnt/zyc_wzh/inference_SLAM_output/Depth_Seg_eval_Result/seg_maps"
  metrics: "/mnt/zyc_wzh/inference_SLAM_output/Depth_Seg_eval_Result/metrics"

# 深度估计模型配置
depth:
  model: "depth_anything_v2"
  model_size: "large"
  device: "cuda"

# 语义分割模型配置
segmentation:
  model: "mask2former"
  backbone: "swin-l"
  dataset: "cityscapes"
  device: "cuda"
  class_merging:
    enabled: true
  ego_vehicle_mask:
    enabled: false

# FVD配置
fvd:
  clip_length: 16
  resolution: 224

# 处理参数
processing:
  batch_size: 4
  num_workers: 4
  image_size: [1024, 1024]
  save_visualizations: true
  # 帧采样：每隔N帧取一帧（1=全部帧，2=隔一帧取一帧）
  frame_step: 1
