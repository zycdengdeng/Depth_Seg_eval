# 评测配置文件

# 数据路径
data:
  root: "/mnt/zyc_wzh/inference/_eval_frames"
  cameras:
    - "cross_left_120fov"
    - "cross_right_120fov"
    - "front_tele_30fov"
    - "front_wide_120fov"
    - "rear_left_70fov"
    - "rear_right_70fov"
    - "rear_tele_30fov"
  gen_folder: "gen"
  gt_folder: "gt"

# 输出路径
output:
  root: "./results"
  depth_maps: "./results/depth_maps"
  seg_maps: "./results/seg_maps"
  metrics: "./results/metrics"

# 深度估计模型配置
depth:
  model: "depth_anything_v2"  # 可选: depth_anything_v2, midas, metric3d
  model_size: "large"  # small, base, large (或旧名: vits, vitb, vitl)
  device: "cuda"

# 语义分割模型配置
segmentation:
  model: "mask2former"  # 可选: mask2former, segformer, oneformer
  backbone: "swin-l"  # Cityscapes预训练 (mask2former用)
  model_size: "b5"  # segformer用: b0-b5
  dataset: "cityscapes"  # oneformer用: cityscapes, ade20k, coco
  device: "cuda"
  # 类别合并：将19个Cityscapes细粒度类合并为7个超类
  # flat(路面), construction(建筑), object(设施), nature(自然), sky(天空), human(行人), vehicle(车辆)
  class_merging:
    enabled: true  # 是否启用超类指标（同时保留细粒度指标）

  # 自车车身处理：部分相机边缘会出现自车车身，被Mask2Former误分类为building
  # 这里配置各相机的自车区域，评测时将这些区域的building重映射为car
  # 注：经测试影响很小，默认禁用
  ego_vehicle_mask:
    enabled: false
    # 各相机的自车区域配置 (edge: left/right, ratio: 占图像宽度的比例)
    cameras:
      rear_left_70fov:
        edge: "left"
        ratio: 0.15  # 左边15%
      rear_right_70fov:
        edge: "right"
        ratio: 0.15  # 右边15%

# NTA-IoU 配置 (交通参与者检测一致性，使用YOLO11)
nta:
  model_size: "l"              # YOLO11模型大小: n/s/m/l/x
  device: "cuda"
  conf_threshold: 0.25         # 检测置信度阈值
  iou_threshold: 0.45          # NMS的IoU阈值
  match_iou_threshold: 0.5     # 匹配gen/gt检测框的IoU阈值
  per_class: true              # 是否计算每个交通参与者类别的NTA-IoU

# NTL-IoU 配置 (车道线检测一致性，使用TwinLiteNet)
ntl:
  model_path: null             # TwinLiteNet权重路径，null则自动下载/使用预训练编码器
  device: "cuda"
  input_height: 360            # TwinLiteNet输入高度
  input_width: 640             # TwinLiteNet输入宽度
  lane_tolerance: 3            # 车道线F1计算的容差像素数
  compute_drivable_area: true  # 是否同时计算可行驶区域IoU

# 评测指标
metrics:
  depth:
    - "abs_rel"      # 绝对相对误差
    - "sq_rel"       # 平方相对误差
    - "rmse"         # 均方根误差
    - "rmse_log"     # 对数均方根误差
    - "delta_1"      # δ < 1.25
    - "delta_2"      # δ < 1.25²
    - "delta_3"      # δ < 1.25³
  segmentation:
    - "miou"         # 平均IoU
    - "pixel_acc"    # 像素准确率
    - "class_iou"    # 每类IoU
    - "fwiou"        # 频率加权IoU

# 处理参数
processing:
  batch_size: 4
  num_workers: 4
  image_size: [1024, 1024]  # 评测时的图像大小
  save_visualizations: true
